plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base { archivesName = project.archives_base_name }
version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation files("libs/meteor-client.jar")
    implementation "meteordevelopment:orbit:0.2.4"
    compileOnly "meteordevelopment:baritone:26.2-SNAPSHOT"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

processResources {
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}
